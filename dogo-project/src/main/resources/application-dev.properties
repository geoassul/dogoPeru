# Configuración específica para desarrollo
# Se carga con el perfil 'dev' (crea además los usuarios de prueba admin/admin y user/user).
# Los orígenes CORS se heredan de application.properties (incluye la red local para el celular).

# Logging más detallado para desarrollo
logging.level.org.springframework.web=DEBUG
logging.level.com.example.dogo_project=DEBUG

# Mostrar SQL queries en desarrollo (útil para vigilar el problema N+1)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

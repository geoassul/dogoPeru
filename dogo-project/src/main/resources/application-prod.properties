# Configuración específica para producción
# Este archivo se carga cuando se ejecuta con el perfil 'prod'

# CORS restrictivo para producción
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://yourdomain.com,https://www.yourdomain.com}
app.cors.allow-credentials=true
app.cors.max-age=86400

# Configuración de logging para producción
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.com.example.dogo_project=INFO
logging.level.root=WARN

# Cache habilitado para producción
spring.cache.type=simple

# No mostrar SQL en producción
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Configuración de seguridad adicional para producción
server.error.include-stacktrace=never
server.error.include-message=never

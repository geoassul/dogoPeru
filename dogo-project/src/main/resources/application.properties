spring.application.name=dogo-project-v1

# Variables locales (DB_PASSWORD, JWT_SECRET, ...) desde el archivo .env de la raíz del proyecto,
# si existe. Las variables de entorno del sistema tienen prioridad. Ver .env.example
spring.config.import=optional:file:.env[.properties]

# Configuración de la base de datos MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tienda_ropa_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA/Hibernate
# El esquema lo gestionan los scripts de /sql. "update" llegó a crear columnas duplicadas
# (tipo_manga junto a tipoManga), así que por defecto Hibernate no toca el esquema.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Problema N+1: las relaciones son LAZY y los repositorios cargan con JOIN FETCH lo que necesita
# cada respuesta. open-in-view=false hace que una carga LAZY fuera de transacción falle en vez de
# lanzar consultas ocultas desde el controlador. batch_fetch_size queda como red de seguridad.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=16
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_size=20

# Configuración del servidor
server.port=${SERVER_PORT:8080}
# Escucha en todas las interfaces (necesario para probar desde el celular en la red local)
server.address=0.0.0.0
server.connection-timeout=60000
server.error.include-stacktrace=never
server.error.include-message=never

# Logging (el perfil dev muestra SQL y más detalle)
logging.level.org.springframework.web=INFO
logging.level.com.example.dogo_project=INFO

# Configuración de formato de fecha/hora
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Lima

# Upload de archivos (imágenes)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:${user.home}/dogo-uploads}
app.upload.max-size=${UPLOAD_MAX_SIZE:10485760}

# Cache
spring.cache.type=simple

# CORS de la API privada (panel/admin): orígenes permitidos separados por comas (admite comodines en IP/puerto).
# El catálogo público /api/public/** acepta cualquier origen (ver CorsConfig), no hace falta agregar la web aquí.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:4200,http://127.0.0.1:8080,http://192.168.*.*:8080,http://192.168.*.*:3000,http://192.168.*.*:4200}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
app.cors.max-age=${CORS_MAX_AGE:3600}

# JWT: JWT_SECRET es obligatorio (Base64 de al menos 32 bytes); sin él la aplicación no arranca.
# Generar uno con:  openssl rand -base64 48
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

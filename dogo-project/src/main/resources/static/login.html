<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoGo Store - Login</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%90%95%3C/text%3E%3C/svg%3E">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .login-container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .logo { text-align: center; margin-bottom: 2rem; }
        .logo h1 { color: #333; font-size: 2rem; margin-bottom: 0.5rem; }
        .logo p { color: #666; font-size: 0.9rem; }

        .form-group { margin-bottom: 1rem; }

        label { display: block; margin-bottom: 0.5rem; color: #333; font-weight: 500; }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e1e1e1;
            border-radius: 5px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus, input[type="password"]:focus { outline: none; border-color: #667eea; }

        .btn {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .btn:hover { transform: translateY(-2px); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .alert { padding: 0.75rem; margin: 1rem 0 0; border-radius: 5px; display: none; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🐕 DoGo Store</h1>
            <p>Sistema de Gestión de Tienda</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn" id="loginBtn">Iniciar Sesión</button>
        </form>

        <div id="alert" class="alert" role="alert"></div>
    </div>

    <script>
        // Mismo origen que la página: funciona en localhost y desde el celular por la IP de la red local
        const API_BASE_URL = window.location.origin;
        const PANEL_URL = '/admin/';

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const alertBox = document.getElementById('alert');

        // Si ya hay una sesión válida, ir directo al panel
        window.addEventListener('load', async () => {
            const token = localStorage.getItem('dogoToken');
            if (!token) return;
            try {
                const response = await fetch(`${API_BASE_URL}/auth/validate`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    window.location.replace(PANEL_URL);
                } else if (response.status === 401) {
                    clearSession();
                    showAlert('Tu sesión ha expirado. Inicia sesión nuevamente.', 'error');
                }
            } catch (error) {
                showAlert('No se puede conectar al servidor. Asegúrese de que esté ejecutándose.', 'error');
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginBtn.disabled = true;
            loginBtn.textContent = 'Iniciando sesión...';
            hideAlert();

            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value.trim(),
                        password: document.getElementById('password').value
                    })
                });
                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('dogoToken', data.data.token);
                    localStorage.setItem('dogoUser', JSON.stringify(data.data.user));
                    localStorage.setItem('dogoLoginTime', new Date().toISOString());
                    showAlert('Login exitoso, entrando al panel...', 'success');
                    window.location.replace(PANEL_URL);
                } else {
                    showAlert(data.message || 'Error en el login', 'error');
                }
            } catch (error) {
                showAlert('Error de conexión. Verifique que el servidor esté ejecutándose.', 'error');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Iniciar Sesión';
            }
        });

        function clearSession() {
            localStorage.removeItem('dogoToken');
            localStorage.removeItem('dogoUser');
            localStorage.removeItem('dogoLoginTime');
        }

        function showAlert(message, type) {
            alertBox.textContent = message;
            alertBox.className = `alert alert-${type}`;
            alertBox.style.display = 'block';
        }

        function hideAlert() {
            alertBox.style.display = 'none';
        }
    </script>
</body>
</html>
